name: classvault
description: "ClassVault - Your Personal Academic Workspace"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  provider: ^6.1.2

  # --- Local database (Phase 1) ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # --- UI ---
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # --- Phase 3: Timetable upload & extraction ---
  file_picker: 10.3.8          # pick image/PDF from device
  image_picker: ^1.1.2            # camera capture, also used later in Phase 7
  google_mlkit_text_recognition: ^0.13.0   # OCR for timetable images (and Phase 9 lectures)
  syncfusion_flutter_pdf: ^26.0.0 # extract text from timetable PDFs (headless, no viewer UI)

  # --- Phase 10: AI Features ---
  http: ^1.2.1                          # Gemini API calls (also reused by Phase 11 subject chat)
  flutter_secure_storage: ^9.2.2        # Gemini API key, kept off Isar's plaintext store
  share_plus: ^11.0.0                   # "Share" action on AI results

  # === Added in LATER phases (kept here for reference, uncomment when needed) ===
  # syncfusion_flutter_pdfviewer: ^26.0.0    # PDF viewing (Phase 6)

  # Phase 16 (Settings — Export/Import Database, Backup Folder, Clear
  # Cache) needed no new packages: file_picker (Phase 3), path_provider
  # (Phase 1), and share_plus (Phase 10) already covered all of it.

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts: []

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#FFFFFF"