name: classvault
description: "ClassVault - Your Personal Academic Workspace"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  provider: ^6.1.2

  # --- Local database (Phase 1) ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # --- UI ---
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # --- Phase 3: Timetable upload & extraction ---
  file_picker: 10.3.8          # pick image/PDF from device
  image_picker: ^1.1.2            # camera capture, also used later in Phase 7
  google_mlkit_text_recognition: ^0.13.0   # OCR for timetable images (and Phase 9 lectures)
  syncfusion_flutter_pdf: ^30.1.38 # extract text from timetable PDFs (headless, no viewer UI)
  syncfusion_flutter_pdfviewer: ^30.1.38 # in-app PDF viewing for Resources/Syllabus/Assignments
  open_filex: ^4.5.0               # hand off PPT/Word files to an installed OS viewer app
  speech_to_text: ^7.0.0           # ClassVault bot voice input
  flutter_tts: ^4.0.0              # ClassVault bot voice output (always-on speech)

  # --- Phase 10: AI Features ---
  http: ^1.2.1                          # Gemini API calls (also reused by Phase 11 subject chat)
  flutter_secure_storage: ^9.2.2        # Gemini API key, kept off Isar's plaintext store
  share_plus: ^11.0.0                   # "Share" action on AI results

  # Phase 16 (Settings — Export/Import Database, Backup Folder, Clear
  # Cache) needed no new packages: file_picker (Phase 3), path_provider
  # (Phase 1), and share_plus (Phase 10) already covered all of it.

  # Phase 17 (Reminders) — local, on-device notifications for Notes
  # ("remind me before next lecture") and Assignments (day-before /
  # due-date / snooze). No backend, so no push/FCM needed.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4            # TZDateTime for zonedSchedule
  flutter_timezone: ^3.0.1    # reads the device's IANA timezone name

  # PPT/Word text extraction for Resources + AI chat context. .docx and
  # .pptx are both just zip archives of XML under the hood, so rather
  # than pull in a heavyweight/native Office SDK, TextExtractionService
  # unzips them with `archive` and reads the text runs out of the XML
  # with `xml` — same trick Syncfusion's own DOCX/PPTX readers use
  # internally, just without needing that whole dependency.
  archive: ^3.6.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts: []

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#FFFFFF"